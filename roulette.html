本を読む</textarea><p class="hint">空行は無視します。同じ候補を複数入れると、その分当たりやすくなります。</p><button id="roulette-run" type="button">ルーレットを回す</button><p class="error" id="roulette-error" role="alert"></p></div><div class="panel result-panel"><div class="wheel-wrap"><span class="pointer" aria-hidden="true">▼</span><svg id="wheel" viewBox="0 0 320 320" role="img" aria-label="ルーレット"></svg></div><p class="result-label">結果</p><output class="result" id="roulette-result" aria-live="polite">回してみよう</output></div></div><div class="guide"><h2>使い方</h2><p>候補を改行で区切って入力し、「ルーレットを回す」を押します。候補を変えれば、食事や遊びの行き先、当番決めなどにも使えます。</p><p>選択は各行が等確率です。同じ候補を2行入れると、その候補が選ばれる確率は上がります。</p></div></section>
