  <header class="site-header"><a class="brand" href="./">ちょい決めツール</a><nav aria-label="ツール"><a href="./roulette.html">ルーレット</a><a href="./amidaku.html">あみだくじ</a><a href="./dice.html">サイコロ</a></nav></header>
  <main class="single-tool">
    <p class="back"><a href="./">← ツール一覧</a></p>
    <section class="tool-section" id="dice" aria-labelledby="dice-title">
      <div class="section-heading"><span class="eyebrow">ランダムツール</span><h1 id="dice-title">サイコロ</h1><p>個数と面数を選んで、サイコロを振ろう。</p></div>
      <div class="workspace">
        <div class="panel"><div class="dice-settings"><div><label for="dice-count">サイコロの数</label><select id="dice-count"><option value="1">1個</option><option value="2">2個</option><option value="3">3個</option><option value="4">4個</option><option value="5">5個</option><option value="6">6個</option><option value="7">7個</option><option value="8">8個</option><option value="9">9個</option><option value="10">10個</option></select></div><div><label for="dice-sides">サイコロの面数</label><select id="dice-sides"><option value="4">4面</option><option value="6" selected>6面</option><option value="8">8面</option><option value="10">10面</option><option value="12">12面</option><option value="20">20面</option></select></div></div><button id="dice-roll" type="button">サイコロを振る</button></div>
        <div class="panel result-panel"><div id="dice-faces" class="dice-faces single" aria-hidden="true"><span class="die die-d6"><span class="die-value">?</span></span></div><p class="result-label">結果</p><output id="dice-result" class="result" aria-live="polite">振ってみよう</output></div>
      </div>
      <div class="guide"><h2>使い方</h2><p>4・6・8・10・12・20面ダイスを1〜10個まで同時に振れます。転がった後に各出目と合計を表示します。</p><p>ボードゲームや遊びの順番決めに、その場ですぐ使えます。</p></div>
